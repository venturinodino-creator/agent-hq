name: Agent HQ snapshot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Collect repo + agent data
        run: node scripts/snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private visibility list. Unset = publish every repo.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Commit data.json
        run: |
          git config user.name  "agent-hq-bot"
          git config user.email "agent-hq-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "snapshot: $(date -u +%FT%TZ) [skip ci]"
          git push
